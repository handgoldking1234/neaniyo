<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>로그인 코드 복사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 메일의 '코드 복사' 버튼이 여는 화면. 코드는 주소의 # 뒤에 있어 서버로 보내지지 않아요. 네아니요·바로웹툰 등 IUX 서비스 공용 */
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#E8336D;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#f3f4f6;--mute:#9ca3af;--line:#2a2f37;--ok:#22c55e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;word-break:keep-all}
.card{width:min(420px,100%);background:var(--card);border-radius:20px;padding:32px 24px 26px;text-align:center}
.brand{margin:0 0 14px;font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.04em}
h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--mute);font-size:14px;line-height:1.6}
.code{display:flex;gap:8px;justify-content:center;margin:0 0 22px}
.code span{flex:1 1 0;max-width:50px;height:60px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.code b{display:block;font-weight:inherit;animation:pop .34s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{0%{transform:translateY(8px) scale(.5);opacity:0}60%{transform:translateY(-3px) scale(1.12);opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.code b{animation:none}}
button{width:100%;height:54px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .1s}
button:active{transform:scale(.98)}
button.done{background:var(--ok);color:#fff}
button svg{width:20px;height:20px}
.msg{min-height:22px;margin:14px 0 0;font-size:13.5px;color:var(--mute);line-height:1.6}
.none{color:var(--mute);font-size:14px;margin:0 0 6px}
</style>
</head>
<body>
<main class="card">
  <p class="brand">IUX</p>
  <h1 id="t">로그인 코드</h1>
  <p class="sub" id="s">아래 버튼을 눌러 코드를 복사한 뒤, 로그인 창으로 돌아가 붙여넣어 주세요.</p>
  <div class="code" id="c" aria-live="polite"></div>
  <button type="button" id="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span>코드 복사하기</span></button>
  <p class="msg" id="m" role="status"></p>
</main>
<script>
(function(){
  var en=!/^ko/i.test(navigator.language||'ko');
  var T=en?{t:'Your sign-in code',s:'Tap the button to copy the code, then go back to the sign-in window and paste it.',b:'Copy code',ok:'Copied',okm:'Go back to the sign-in window and paste it (or tap “Paste copied code”).',fail:'Could not copy automatically. Press and hold the numbers to copy them.',none:'There is no code here. Please open this page from the button in the email.'}
               :{t:'로그인 코드',s:'아래 버튼을 눌러 코드를 복사한 뒤, 로그인 창으로 돌아가 붙여넣어 주세요.',b:'코드 복사하기',ok:'복사했어요',okm:'로그인 창으로 돌아가 붙여넣어 주세요. (\'복사한 코드 붙여넣기\' 버튼을 눌러도 돼요)',fail:'자동으로 복사하지 못했어요. 숫자를 길게 눌러 복사해 주세요.',none:'코드가 없어요. 메일의 버튼으로 다시 열어 주세요.'};
  if(en) document.documentElement.lang='en';
  var $=function(id){return document.getElementById(id)};
  $('t').textContent=T.t; $('s').textContent=T.s; $('b').querySelector('span').textContent=T.b; document.title=T.t;
  // 코드는 # 뒤(서버로 안 감). ?c= 로 와도 받음
  var raw=(location.hash||'').slice(1)||new URLSearchParams(location.search).get('c')||'';
  var code=decodeURIComponent(raw).replace(/\D/g,'').slice(0,8);
  if(code.length<6){ $('c').outerHTML='<p class="none">'+T.none+'</p>'; $('b').hidden=true; return; }
  $('c').innerHTML=code.split('').map(function(d,i){return '<span><b style="animation-delay:'+(i*70)+'ms">'+d+'</b></span>'}).join('');
  $('c').setAttribute('aria-label',code);
  var done=function(){ var b=$('b'); b.classList.add('done'); b.querySelector('span').textContent=T.ok; $('m').textContent=T.okm; };
  var fallback=function(){
    try{ var ta=document.createElement('textarea'); ta.value=code; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99); var ok=document.execCommand('copy'); document.body.removeChild(ta); if(ok) return done(); }catch(e){}
    $('m').textContent=T.fail;
  };
  var copy=function(){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,fallback); else fallback(); };
  $('b').onclick=copy;
})();
</script>
</body>
</html>
